# Let feral-controld's captive portal bind :80 as an unprivileged user.
#
# feral-controld runs as a `systemd --user` service under the feralfile user
# (uid 1000). In a user manager the unit's AmbientCapabilities/CAP_NET_BIND_
# SERVICE grant is inert, so the daemon cannot normally listen on the privileged
# port 80 that the captive-portal probe expects. Lowering the unprivileged port
# floor to 80 lets it bind directly without running as root or fronting it with
# a root-owned proxy.
#
# This is a system-wide sysctl, so it survives OTA binary replacement of the
# daemon (unlike a per-unit capability grant). Widening the unprivileged range
# to include :80 is an accepted appliance-wide trade-off, named in the
# docs/architecture sign-off for the SoftAP/setupd merge.
net.ipv4.ip_unprivileged_port_start=80
