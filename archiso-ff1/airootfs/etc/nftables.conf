#!/usr/bin/nft -f
# Captive-portal NAT for the SoftAP provisioning hotspot.
#
# The hotspot's dnsmasq (NetworkManager/dnsmasq-shared.d/captive.conf) answers
# every DNS query with 192.0.2.1 — a public-looking RFC 5737 TEST-NET address,
# chosen because Samsung One UI refuses captive detection when probe hostnames
# resolve to private IPs. This table completes the trick: any client packet to
# 192.0.2.1 on :80 is redirected to the local captive portal (feral-controld
# on :80), and :443 is redirected to a closed local port so HTTPS probes fail
# fast with a RST instead of hanging until timeout. The human-facing address
# http://ff1.config rides the same path (the DNS layer resolves it to
# 192.0.2.1), so this rule needs no hostname awareness — and the fast :443 RST
# is also what makes browsers' HTTPS-first upgrade of a typed ff1.config fall
# back to HTTP quickly.
#
# Safe to keep loaded at all times: 192.0.2.1 is reserved (never routable), so
# outside an active hotspot session no traffic can match these rules. This file
# fully replaces the Arch sample config on purpose — do NOT add a filter table
# here, or you may firewall off DHCP/DNS/portal traffic on the hotspot.

flush ruleset

table ip feral_captive {
    chain prerouting {
        type nat hook prerouting priority dstnat;
        ip daddr 192.0.2.1 tcp dport { 80, 443 } redirect
    }
}
