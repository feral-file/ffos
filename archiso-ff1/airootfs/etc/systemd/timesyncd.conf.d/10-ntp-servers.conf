# Pin explicit NTP servers for systemd-timesyncd.
#
# With BLE provisioning removed, the old feral-setupd `set_time` BLE command is
# gone (it was already a no-op) and NTP is now the device's ONLY wall-clock
# source. Pinning known-good servers here — rather than relying on DHCP-supplied
# NTP or an empty default — makes clock sync deterministic on first boot.
#
# A correct clock is a prerequisite for the short-lived-credential work (#3471):
# TLS and token validation both reject a badly-skewed clock, so this drop-in is
# discharged early as a dependency of that effort.
[Time]
NTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org
FallbackNTP=time.cloudflare.com
