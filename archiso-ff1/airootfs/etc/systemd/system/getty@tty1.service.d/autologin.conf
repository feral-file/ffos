# Live ISO only: the installer, soak-test, factory-check and display-check
# entries autologin root/soaktest/root/root on tty1 (display-check: factory
# ISO only, whose entries mask kmsconvt@tty1 so tty1 comes here). On an
# installed FF1 (no archisobasedir= on the cmdline) this condition
# fails, no getty runs on tty1 and feral-kiosk-startup.service owns the VT
# (ffos#126). Developers use getty@tty2 (password login, Ctrl+Alt+F2) or SSH.
[Unit]
ConditionKernelCommandLine=archisobasedir
[Service]
ExecStart=
ExecStart=-/usr/bin/bash -c '/usr/bin/agetty --noclear --autologin $((grep -q "script=/root/scripts/install-to-disk.sh" /proc/cmdline && echo root) || (grep -q "script=/root/scripts/auto-install.sh" /proc/cmdline && echo root) || (grep -q "script=/home/soaktest/scripts/soak-test.sh" /proc/cmdline && echo soaktest) || (grep -q "script=/home/feralfile/scripts/factory-check.sh" /proc/cmdline && echo root) || (grep -q "script=/home/feralfile/scripts/display-check.sh" /proc/cmdline && echo root) || echo feralfile) %I $TERM'
