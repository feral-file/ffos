[Unit]
Requires=feral-owner-guard.service
After=feral-owner-guard.service
RequiresMountsFor=/.snapshots
ConditionPathExists=/.snapshots/.tailscale/enabled

[Service]
ExecStartPre=/usr/local/bin/feral-tailscale guard
ExecStart=
ExecStart=/usr/bin/tailscaled --state=/.snapshots/.tailscale/tailscaled.state --statedir=/.snapshots/.tailscale --socket=/run/tailscale/tailscaled.sock --port=41641
# StateDirectory would otherwise create an unused identity location in root.
StateDirectory=
