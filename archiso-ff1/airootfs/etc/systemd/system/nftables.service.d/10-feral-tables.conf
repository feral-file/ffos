[Service]
# A distro ExecStop that flushes the ruleset would remove other services' rules.
ExecStop=
# Tolerate an already-missing table: stop after an out-of-band flush must not fail the unit.
ExecStop=-/usr/bin/nft delete table ip feral_captive
ExecReload=
ExecReload=/usr/bin/nft -f /etc/nftables.conf
RemainAfterExit=yes
