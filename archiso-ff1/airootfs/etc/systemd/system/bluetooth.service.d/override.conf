[Service]
# bluetoothd does not respect DisablePlugins in main.conf anymore; invoke it
# without the battery plugin so our provisioning channel stays stable.
ExecStart=
ExecStart=/usr/lib/bluetooth/bluetoothd --noplugin=battery
# Upstream bluez ships no Restart policy, so a crashed bluetoothd stays dead and
# BLE pairing is gone until a power cycle. Restart it so feral-setupd's adapter
# watchdog (which re-registers the GATT application and advertisement when the
# adapter reappears) can heal the pairing surface automatically (ff-app #556).
Restart=on-failure
RestartSec=2
