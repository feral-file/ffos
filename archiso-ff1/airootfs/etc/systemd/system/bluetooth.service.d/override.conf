[Service]
# bluetoothd does not respect DisablePlugins in main.conf anymore; invoke it
# without the battery plugin so the Bluetooth audio stack stays stable.
ExecStart=
ExecStart=/usr/lib/bluetooth/bluetoothd --noplugin=battery
# Upstream bluez ships no Restart policy, so a crashed bluetoothd stays dead
# until a power cycle. BLE provisioning is gone (merged into feral-controld's
# SoftAP path), but Bluetooth AUDIO still depends on a live bluetoothd, so keep
# restarting it automatically (original adapter-watchdog rationale: ff-app #556).
Restart=on-failure
RestartSec=2
