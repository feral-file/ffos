# The kiosk startup unit and every getty are ordered After= these units. A
# plymouth daemon that never answers `quit`/`--wait` must not hold the boot
# forever (seen on a live ISO build, ffos#126 follow-up): bound it. ExecStart
# is already `-` prefixed, so the timeout degrades to "no splash", never to
# "no kiosk".
[Service]
TimeoutStartSec=30
