# Captive-portal DNS for the SoftAP provisioning hotspot.
#
# When feral-controld brings up the NetworkManager shared-mode ("hotspot")
# connection, NM spawns a dedicated dnsmasq instance and feeds it every file in
# this directory. The catch-all below resolves EVERY DNS name the phone/laptop
# asks for to 192.0.2.1, which /etc/nftables.conf redirects back to the
# device's captive portal (feral-controld on :80), so the OS captive-portal
# probe fails closed and the client auto-opens the provisioning portal.
#
# This only applies to the isolated hotspot network; it has no effect on the
# device's own upstream resolution once it joins the user's Wi-Fi and the AP is
# torn down.
#
# The answer is deliberately NOT 10.42.0.1: Samsung One UI's NetworkStack
# refuses captive-portal detection when the probe hostname resolves to a
# private (RFC 1918) address — it logs "DNS response to the URL is private IP",
# skips the HTTP probe entirely, and reports "no internet" instead of raising
# the sign-in sheet (verified on a Galaxy S23 Ultra via logcat). Answering with
# a public-looking but reserved TEST-NET address (RFC 5737) passes that check;
# /etc/nftables.conf then redirects 192.0.2.1:80/443 back to the local portal.
#
# ff1.config remains an explicit compatibility alias for captive detection and
# older clients. Current setup surfaces use the hotspot's live on-link address
# as the human browser fallback because private/cellular DNS can bypass this
# dnsmasq instance. The catch-all already resolves the alias, but the explicit
# entry keeps it working if the catch-all is ever narrowed. It is never
# delegated upstream: this dnsmasq only serves the isolated hotspot.
address=/ff1.config/192.0.2.1
address=/#/192.0.2.1
