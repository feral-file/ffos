# Factory ISO only (factory-iso/apply.sh).
# Pango draws Latin from DejaVu Sans Mono and Chinese from Noto Sans Mono CJK
# SC (both on the image). SC named so Han takes the Simplified Chinese forms,
# not the forms of whatever the locale (en_US) would fall back to.
font-engine=pango
font-name=DejaVu Sans Mono,Noto Sans Mono CJK SC
# Read from across the bench; about 100 columns on a 1080p panel, 200 on 4K.
font-size=24
# The keyboard is unplugged once the check runs: nothing could wake a blanked
# screen, and the screen is the record.
dpms-timeout=0
