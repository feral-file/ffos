# Factory ISO only (factory-iso/apply.sh): no login, the factory check runs
# as root straight away, as the getty@tty1 autologin would have run it. kmscon
# resets the environment and sets TERM=kmscon, which is how the scripts know
# they may print Chinese.
# kmscon starts its program again the moment it exits, and the restart would
# clear the screen (the record) and leave the results stick behind, still
# mounted. So an exit stays on screen with its code until the power is pulled,
# and Ctrl+C on the keyboard still plugged in at boot is ignored (the ignore
# carries into the check) rather than ending it.
# $$ is systemd's spelling of a literal $.
[Service]
ExecStart=
ExecStart=/usr/bin/kmscon --vt=%I --no-switchvt --login -- /usr/bin/bash -c 'trap "" INT QUIT; /usr/bin/bash /home/feralfile/scripts/factory-check.sh; echo "factory check exited ($$?) / 出厂检测已退出（$$?）"; exec sleep infinity'
