name: 'Setup Pacman'
description: 'Configure pacman mirrorlist and keyring for a given snapshot, then refresh the package database'

inputs:
  pacman_snapshot:
    description: 'Pacman repository snapshot (YYYY/MM/DD) or "latest"'
    required: false
    default: 'latest'
  arch_cache_token:
    description: 'Token for the ff-arch-cache mirror of pinned snapshots (secrets.ARCH_CACHE_TOKEN). Empty: use the archive directly.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Writes two mirrorlists.
    #
    # /etc/pacman.d/mirrorlist.device is what an image ships: official servers
    # only, the same content this step has always written. Devices in the field
    # sync from the Arch archive directly.
    #
    # /etc/pacman.d/mirrorlist is what this build container uses. For a pinned
    # snapshot it puts ff-arch-cache first (feral-file/ff-arch-cache: a
    # Cloudflare Worker that keeps every snapshot file a build has fetched in
    # R2), because the archive is the snapshot's only source and stalls often
    # enough to fail builds. The archive stays as the second Server, so a build
    # still works when the cache is down or refuses the token; pacman's output
    # then shows the failed retrievals from arch-cache.feralfile.io.
    #
    # That first line carries the access token, so the build mirrorlist must
    # never be copied into an image. The image workflows copy
    # mirrorlist.device and check the built image for the cache's host name;
    # scripts/verify.sh pins both.
    #
    # "latest" moves every day and is not cached: both files are the official
    # mirror list.
    - name: Configure mirrorlist
      shell: bash
      env:
        SNAPSHOT: ${{ inputs.pacman_snapshot }}
        ARCH_CACHE_TOKEN: ${{ inputs.arch_cache_token }}
      run: |
        device=/etc/pacman.d/mirrorlist.device
        if [ "$SNAPSHOT" = "latest" ]; then
          echo "Using latest Arch Linux repositories"
          curl -o "$device" \
            "https://archlinux.org/mirrorlist/?country=US&protocol=https&ip_version=4&use_mirror_status=on"
          sed -i 's/^#Server/Server/' "$device"
          cp "$device" /etc/pacman.d/mirrorlist
        else
          echo "Using Arch Linux Archive snapshot: $SNAPSHOT"
          {
            echo "# Arch Linux Archive - ${SNAPSHOT} snapshot"
            echo "Server = https://archive.archlinux.org/repos/${SNAPSHOT}/\$repo/os/\$arch"
          } > "$device"
          if [ -n "$ARCH_CACHE_TOKEN" ]; then
            echo "Using ff-arch-cache ahead of the archive"
            {
              echo "Server = https://ci:${ARCH_CACHE_TOKEN}@arch-cache.feralfile.io/repos/${SNAPSHOT}/\$repo/os/\$arch"
              cat "$device"
            } > /etc/pacman.d/mirrorlist
          else
            echo "::notice::ARCH_CACHE_TOKEN is not set; using archive.archlinux.org directly"
            cp "$device" /etc/pacman.d/mirrorlist
          fi
        fi

    - name: Initialize keyring and refresh package database
      shell: bash
      run: |
        pacman-key --init
        pacman-key --populate archlinux
        pacman -Syy
