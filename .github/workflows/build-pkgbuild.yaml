name: 🔒 Build PKGBUILD Package

# Builds one directory under packages/ (a hand-written PKGBUILD, as opposed
# to the generated Go/Rust PKGBUILDs in build-components.yaml), signs the
# result with the release key and uploads it to the branch's R2 pacman repo.
# pacman-repo.yaml picks it up when it regenerates the database.

on:
  workflow_call:
    inputs:
      package:
        description: 'Directory name under packages/'
        required: true
        type: string
      environment:
        description: 'Environment (selects secrets and R2 bucket)'
        required: true
        type: string
        default: 'Development'
      pacman_snapshot:
        description: 'Pacman repository snapshot to use'
        required: false
        type: string
        default: 'latest'
      ffos_user_ref:
        description: 'Source ref of the matching native player and daemons'
        type: string
        required: false
      container_image:
        description: 'Container image to use for the build'
        required: true
        type: string
    outputs:
      native_version:
        value: ${{ jobs.native.outputs.version }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_ACCESS_KEY_ID:
        required: true
      CLOUDFLARE_SECRET_ACCESS_KEY:
        required: true
      AWS_KMS_FF1_RELEASE_SIGNER_ROLE_ARN:
        required: true
      AWS_KMS_FF1_RELEASE_SIGNING_KEY_ID:
        required: true

permissions:
  id-token: write
  actions: read
  contents: read

jobs:
  native:
    if: inputs.package == 'ff-player-native'
    uses: ./.github/workflows/native-runtime.yaml
    with:
      ffos_user_ref: ${{ inputs.ffos_user_ref }}

  build-package:
    needs: native
    if: ${{ !cancelled() && (needs.native.result == 'success' || needs.native.result == 'skipped') }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container_image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pacman
        uses: ./.github/actions/setup-pacman
        with:
          pacman_snapshot: ${{ inputs.pacman_snapshot }}

      - name: Download qualified FF1 runtime
        if: inputs.package == 'ff-player-native'
        uses: actions/download-artifact@v4
        with:
          repository: ${{ needs.native.outputs.repository }}
          run-id: ${{ needs.native.outputs.run }}
          github-token: ${{ github.token }}
          name: ff-player-native-linux-x86_64
          path: native-artifact

      - name: Prepare native PKGBUILD
        if: inputs.package == 'ff-player-native'
        run: |
          pacman -S --needed --noconfirm python
          python packages/ff-player-native/prepare.py --artifact native-artifact/ff-player-cef-linux.tar.gz \
            --sha256 "$(cut -d' ' -f1 native-artifact/SHA256SUMS)" \
            --version "${{ needs.native.outputs.version }}" --epoch "${{ needs.native.outputs.epoch }}" --output /tmp/native-package
          mv /tmp/native-package/* packages/ff-player-native/

      # The artifact is a pure function of the package directory and the
      # pacman snapshot (same sources, same config, same toolchain), so a
      # previous build with identical inputs is reused instead of spending
      # ~8 min recompiling amdgpu. Any edit to PKGBUILD, a patch or config, or
      # a snapshot bump, changes the key and forces a rebuild; bumping pkgrel
      # does too. Signing and upload still run on a hit so R2 stays complete
      # for a branch whose repo has not carried the package yet.
      - name: Restore previously built package
        id: cache
        uses: actions/cache@v4
        with:
          path: packages/${{ inputs.package }}/*.pkg.tar.zst
          # Only the PKGBUILD is hashed, and that is a complete fingerprint of
          # the local sources: every patch and config file is listed in
          # source= with a real sha256sum that makepkg verifies, so editing one
          # without updating the PKGBUILD fails the build rather than reusing a
          # stale artifact, and adding one changes source=. A package that
          # lists a local source with a SKIP checksum must not rely on this
          # cache.
          #
          # Do not widen this to packages/<pkg>/*. hashFiles descends into
          # matched directories, and the key is evaluated twice: at restore
          # time, when the directory holds only the checked-in files, and in
          # the post step, when makepkg has left its src/ and pkg/ trees (the
          # whole kernel source and build output) behind. Hashing those trees
          # on the host runner failed and marked an otherwise successful job
          # as failed (run 34589376367).
          key: pkgbuild-${{ inputs.package }}-${{ inputs.pacman_snapshot }}-${{ hashFiles(format('packages/{0}/PKGBUILD', inputs.package)) }}

      - name: Install build tooling
        run: |
          set -euo pipefail
          if ! pacman -S --noconfirm --needed base-devel shadow; then
            # The dated repository can lose a package link while the archive
            # still serves the exact file selected by the snapshot database.
            packages=$(pacman -Sp --needed --print-format '%n %f %h' base-devel shadow)
            cache=$(pacman-conf CacheDir | head -n1)
            while read -r name file digest; do
              [[ -n "$name" && ! -f "$cache/$file" ]] || continue
              url="https://umea.archive.pkgbuild.com/packages/${name:0:1}/$name/$file"
              curl -fL --retry 2 --connect-timeout 10 --max-time 180 -o "$cache/$file.part" "$url"
              printf '%s  %s\n' "$digest" "$cache/$file.part" | sha256sum --check --status
              mv "$cache/$file.part" "$cache/$file"
            done <<< "$packages"
            pacman -S --noconfirm --needed base-devel shadow
          fi
          useradd -m builder

      - name: Install makedepends
        if: inputs.package != 'ff-player-native' && steps.cache.outputs.cache-hit != 'true'
        working-directory: packages/${{ inputs.package }}
        run: |
          set -euo pipefail
          chown -R builder:builder .
          # Only makedepends are installed here. depends= may name the exact
          # kernel (see amdgpu-vcn-h264-cap), and installing a kernel into
          # the build container would run initramfs hooks for no benefit;
          # the image build resolves depends= against the same snapshot.
          mapfile -t MAKEDEPENDS < <(su builder -c "makepkg --printsrcinfo" \
            | awk -F' = ' '/^\tmakedepends = /{print $2}')
          # mapfile inside a process substitution cannot fail the step, so an
          # unparsed .SRCINFO would silently install nothing. Refuse that.
          (( ${#MAKEDEPENDS[@]} )) || { echo "::error::no makedepends parsed from .SRCINFO"; exit 1; }
          echo "makedepends: ${MAKEDEPENDS[*]}"
          pacman -S --noconfirm --needed "${MAKEDEPENDS[@]}"

      - name: Check depends= resolve in this snapshot
        working-directory: packages/${{ inputs.package }}
        run: |
          set -euo pipefail
          chown -R builder:builder .
          # A version-pinned depends= (e.g. linux-lts=6.18.38-2) that the
          # snapshot cannot satisfy would only fail later, inside mkarchiso,
          # with a generic dependency error. Fail here with the reason.
          mapfile -t DEPENDS < <(su builder -c "makepkg --printsrcinfo" \
            | awk -F' = ' '/^\tdepends = /{print $2}')
          # Same reason as above: an empty array would turn this guard into a
          # silent no-op.
          (( ${#DEPENDS[@]} )) || { echo "::error::no depends parsed from .SRCINFO"; exit 1; }
          for dep in "${DEPENDS[@]}"; do
            name="${dep%%[<>=]*}"
            want="${dep#"$name"}"
            have="$(pacman -Si "$name" | awk -F': *' '/^Version/{print $2; exit}')"
            echo "$name: snapshot has $have, package wants ${want:-any}"
            if [[ "$want" == =* && "$have" != "${want#=}" ]]; then
              echo "::error::packages/${{ inputs.package }} pins $dep but the pacman snapshot ships $name $have. Re-base the package (see its README) or pin the snapshot that matches."
              exit 1
            fi
          done

      - name: Build package
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: packages/${{ inputs.package }}
        run: |
          set -euo pipefail
          # -d: dependency presence was handled above; depends= is deliberately
          # not installed in the container.
          su builder -c "makepkg -f -d --noconfirm"

      - name: Show package
        working-directory: packages/${{ inputs.package }}
        run: |
          set -euo pipefail
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "reusing package built earlier for identical inputs (cache hit)"
          else
            echo "package built in this run"
          fi
          ls -la ./*.pkg.tar.zst
          bsdtar -tf ./*.pkg.tar.zst

      - name: Configure AWS credentials (OIDC for KMS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_KMS_FF1_RELEASE_SIGNER_ROLE_ARN }}
          aws-region: 'ap-northeast-1'

      - name: Install kmspgp
        run: |
          # -f: a GitHub release 504 must fail here, not be saved as the
          # "binary" (it was, and the sign step then died running HTML as a
          # shell script). --retry rides out those transient 5xx. The pinned
          # digest proves the file is the v1.1.0 ELF before it runs with the
          # KMS signing credentials; bump it together with the URL.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o /usr/local/bin/kmspgp \
            https://github.com/hf/kmspgp/releases/download/v1.1.0/kmspgp-v1.1.0-linux-amd64
          echo "a9e1f438aac06657aa726b65031079f5e27b1d1e41dd1ffa7bf55326a8ca2547  /usr/local/bin/kmspgp" \
            | sha256sum -c -
          chmod +x /usr/local/bin/kmspgp

      - name: Sign packages with AWS KMS (OpenPGP)
        working-directory: packages/${{ inputs.package }}
        env:
          KMS_KEY_ID: ${{ secrets.AWS_KMS_FF1_RELEASE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          for p in *.pkg.tar.zst; do
            kmspgp sign "$KMS_KEY_ID" < "$p" > "$p.sig"
          done

      - uses: actions/upload-artifact@v4
        if: inputs.package == 'ff-player-native'
        with:
          name: signed-native-package
          path: packages/ff-player-native/*.pkg.tar.zst*
          if-no-files-found: error

      - name: Rclone to r2
        working-directory: packages/${{ inputs.package }}
        run: |
          pacman -S --noconfirm --needed rclone

          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF

          rclone copy . \
            "r2:${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}/${{ github.ref_name }}/native/os/x86_64/" \
            --include="*.pkg.tar.zst" \
            --include="*.pkg.tar.zst.sig" \
            --s3-upload-cutoff=100M \
            --s3-chunk-size=100M \
            --transfers=7 \
            --verbose \
            --stats=1s

      - name: Package Info
        run: |
          echo "packages/${{ inputs.package }} built, signed and uploaded to R2"
