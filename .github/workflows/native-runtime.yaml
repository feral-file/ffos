name: Resolve native player runtime
on:
  workflow_call:
    inputs:
      ffos_user_ref:
        type: string
        required: true
      expected_package:
        description: 'Package required by the selected image recipe, if specified'
        type: string
        required: false
    outputs:
      package:
        value: ${{ jobs.runtime.outputs.package }}
      archive:
        value: ${{ jobs.runtime.outputs.archive }}
      run:
        value: ${{ jobs.runtime.outputs.run }}
      repository:
        value: ${{ jobs.runtime.outputs.repository }}
      epoch:
        value: ${{ jobs.runtime.outputs.epoch }}
      version:
        value: ${{ jobs.runtime.outputs.version }}
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.select.outputs.package }}
      archive: ${{ steps.select.outputs.archive }}
      run: ${{ steps.select.outputs.run }}
      repository: ${{ steps.select.outputs.repository }}
      epoch: ${{ steps.select.outputs.epoch }}
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: feral-file/ffos-user
          ref: ${{ inputs.ffos_user_ref }}
      - name: Identify reusable runtime built from this commit
        id: select
        env:
          EXPECTED_PACKAGE: ${{ inputs.expected_package }}
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync} = require('node:child_process');
            const sha = execFileSync('git',['rev-parse','HEAD']).toString().trim();
            const epoch = execFileSync('git',['show','-s','--format=%ct','HEAD']).toString().trim();
            const repo = {owner:'feral-file',repo:'ffos-user'};
            // Tag rebuilds use the recipe and source layout that shipped together.
            const display = require('node:fs').existsSync('components/feral-display/tools/build-ff1.sh');
            const dir = display ? 'components/feral-display' : 'components/player';
            const pkg = display ? 'feral-display' : 'ff-player-native';
            const archive = display ? 'feral-display-linux.tar.gz' : 'ff-player-cef-linux.tar.gz';
            if (process.env.EXPECTED_PACKAGE && process.env.EXPECTED_PACKAGE !== pkg) {
              core.setFailed(`Source provides ${pkg} but this ffos recipe requires ${process.env.EXPECTED_PACKAGE}. Use a matching ffos revision or the build-image-from-tags workflow.`);
              return;
            }
            core.setOutput('dir', dir);
            core.setOutput('package', pkg);
            core.setOutput('archive', archive);
            const {data} = await github.rest.actions.listWorkflowRuns({...repo,workflow_id:'build-player.yaml',head_sha:sha,status:'success'});
            let selected;
            for (const run of data.workflow_runs) {
              if (!['push','workflow_dispatch'].includes(run.event) || run.head_sha !== sha || run.head_repository?.full_name !== 'feral-file/ffos-user') continue;
              const {data: artifacts} = await github.rest.actions.listWorkflowRunArtifacts({...repo,run_id:run.id});
              if (artifacts.artifacts.some(a => a.name === pkg + '-linux-x86_64' && !a.expired)) { selected = run; break; }
            }
            core.setOutput('build',selected ? 'false' : 'true');
            core.setOutput('run',selected?.id || context.runId);
            core.setOutput('repository',selected ? 'feral-file/ffos-user' : process.env.GITHUB_REPOSITORY);
            core.setOutput('epoch',epoch);
            core.setOutput('version','3.1.0.native.' + epoch + '.g' + sha.slice(0,12));
      - name: Build and test selected source when no reusable artifact exists
        if: steps.select.outputs.build == 'true'
        env:
          COMPONENT: ${{ steps.select.outputs.dir }}
        run: |
          docker build -t ff-native-build "$COMPONENT"
          docker run --rm -v "$PWD/components:/workspace/components" -w "/workspace/$COMPONENT" ff-native-build sh tools/build-ff1.sh
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.build == 'true'
        with:
          name: ${{ steps.select.outputs.package }}-linux-x86_64
          path: |
            ${{ steps.select.outputs.dir }}/build-ff1/${{ steps.select.outputs.archive }}
            ${{ steps.select.outputs.dir }}/build-ff1/SHA256SUMS
            ${{ steps.select.outputs.dir }}/build-ff1/installed-executables.txt
          if-no-files-found: error
