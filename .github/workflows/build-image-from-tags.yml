name: ▶️ Build FFOS Image From Tags

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image and local package version"
        required: true
        default: "0.0.1"
      ffos_ref:
        description: "ffos git tag/ref to checkout"
        required: true
        default: "v1.0.1"
      ffos_user_ref:
        description: "ffos-user git tag/ref to checkout"
        required: true
        default: "v1.0.1"
      ff_player_ref:
        description: "Optional feral-player repository reference to build local player package"
        required: false
        default: ""
        type: string
      environment:
        description: "Environment to build"
        required: true
        default: "Development"
        type: choice
        options:
          - Development
          - Staging
          - Production
      pacman_snapshot:
        description: "Pacman repository snapshot to use"
        required: false
        default: "2026/07/13"
        type: choice
        options:
          - "2026/07/13"
          - "2025/11/25"
          - "2025/05/31"
          - "latest"
      dev_iso:
        description: "Build development ISO"
        required: true
        default: false
        type: boolean
permissions:
  id-token: write
  actions: read
  contents: read

jobs:
  permission-check:
    name: Permission Check
    uses: ./.github/workflows/permission-check.yaml

  resolve-container:
    needs: permission-check
    uses: ./.github/workflows/resolve-container.yaml
    with:
      pacman_snapshot: ${{ inputs.pacman_snapshot || github.event.inputs.pacman_snapshot }}

  determine-local-player:
    name: Determine Local Player Support
    needs: permission-check
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      native: ${{ steps.profile.outputs.native }}
      ffos_sha: ${{ steps.profile.outputs.ffos_sha }}
      user_sha: ${{ steps.profile.outputs.user_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ffos_ref }}
      - uses: actions/checkout@v4
        with:
          repository: feral-file/ffos-user
          ref: ${{ inputs.ffos_user_ref }}
          path: ffos-user
          persist-credentials: false
      - id: profile
        run: |
          echo "ffos_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "user_sha=$(git -C ffos-user rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if grep -qx ff-player-native archiso-ff1/packages.x86_64; then
            echo native=true >> "$GITHUB_OUTPUT"
          else
            echo native=false >> "$GITHUB_OUTPUT"
          fi
      - name: Check if ffos tag supports local player
        id: check
        if: steps.profile.outputs.native != 'true'
        env:
          FFOS_REF: ${{ inputs.ffos_ref }}
          FF_PLAYER_REF: ${{ inputs.ff_player_ref }}
        run: |
          set -euo pipefail

          MIN_VERSION="1.0.13"
          REF="${FFOS_REF#refs/tags/}"
          REF="${REF#v}"

          if [ -z "${FF_PLAYER_REF}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping local player: ff_player_ref not provided."
            exit 0
          fi

          if ! [[ "$REF" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping local player: ffos_ref '${FFOS_REF}' is not a supported version tag."
            exit 0
          fi

          VERSION="$(printf '%s' "$REF" | grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+')"

          if [ "$(printf '%s\n' "$MIN_VERSION" "$VERSION" | sort -V | head -n1)" = "$MIN_VERSION" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Local player enabled for ffos_ref ${FFOS_REF}."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping local player: ffos_ref ${FFOS_REF} is below v${MIN_VERSION}."
          fi

  native:
    needs: determine-local-player
    if: needs.determine-local-player.outputs.native == 'true'
    uses: ./.github/workflows/native-runtime.yaml
    with:
      ffos_user_ref: ${{ needs.determine-local-player.outputs.user_sha }}

  build-image:
    # These workflows share the branch's ISO listing and version-info object.
    concurrency:
      group: ffos-image-publication-${{ github.ref_name }}
      cancel-in-progress: false
    name: Generate FFOS iso from tags
    needs: [permission-check, resolve-container, determine-local-player, native]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    container:
      image: ${{ needs.resolve-container.outputs.image }}
      options: --privileged

    steps:
      - name: Checkout ffos repository at tag/ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-local-player.outputs.ffos_sha }}

      - name: Checkout image verification from the workflow revision
        if: needs.determine-local-player.outputs.native == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/verify-native-iso.sh
            scripts/publish-version-info.sh
          sparse-checkout-cone-mode: false
          path: workflow-verifier
          persist-credentials: false

      - name: Checkout ffos-user Repository at tag/ref
        uses: actions/checkout@v4
        with:
          repository: feral-file/ffos-user
          ref: ${{ needs.determine-local-player.outputs.user_sha }}
          path: ffos-user

      - name: Checkout feral-player Repository at ref
        if: ${{ needs.determine-local-player.outputs.enabled == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: feral-file/ff-player
          ref: ${{ inputs.ff_player_ref }}
          path: feral-player

      - name: Setup Node.js
        if: ${{ needs.determine-local-player.outputs.enabled == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: feral-player/package-lock.json

      # Inline copy of .github/actions/setup-pacman (this workflow checks ffos
      # out at an older tag, where the action may predate what it needs). See
      # the action for why there are two mirrorlists and why the build one must
      # never reach an image.
      - name: Setup pacman
        env:
          SNAPSHOT: ${{ inputs.pacman_snapshot || github.event.inputs.pacman_snapshot }}
          ARCH_CACHE_TOKEN: ${{ secrets.ARCH_CACHE_TOKEN }}
        run: |
          device=/etc/pacman.d/mirrorlist.device
          if [ "$SNAPSHOT" = "latest" ]; then
            echo "Using latest Arch Linux repositories"
            curl -o "$device" \
              "https://archlinux.org/mirrorlist/?country=US&protocol=https&ip_version=4&use_mirror_status=on"
            sed -i 's/^#Server/Server/' "$device"
            cp "$device" /etc/pacman.d/mirrorlist
          else
            echo "Using Arch Linux Archive snapshot: $SNAPSHOT"
            {
              echo "# Arch Linux Archive - ${SNAPSHOT} snapshot"
              echo "Server = https://archive.archlinux.org/repos/${SNAPSHOT}/\$repo/os/\$arch"
            } > "$device"
            if [ -n "$ARCH_CACHE_TOKEN" ]; then
              echo "Using ff-arch-cache ahead of the archive"
            else
              echo "::notice::ARCH_CACHE_TOKEN is not set; using the archive servers directly"
            fi
            {
              if [ -n "$ARCH_CACHE_TOKEN" ]; then
                echo "Server = https://ci:${ARCH_CACHE_TOKEN}@arch-cache.feralfile.io/repos/${SNAPSHOT}/\$repo/os/\$arch"
              fi
              cat "$device"
              echo "Server = https://umea.archive.pkgbuild.com/repos/${SNAPSHOT}/\$repo/os/\$arch"
            } > /etc/pacman.d/mirrorlist
          fi
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syy

      # Archive downloads stall intermittently for GitHub runners: retry with a
      # pause. Inline, not scripts/install-build-packages.sh, because ffos is
      # checked out at an older tag here, where that script does not exist.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          cachedir="$(pacman-conf CacheDir | head -n1)"
          for attempt in 1 2 3; do
            if pacman -S --noconfirm archiso arch-install-scripts dosfstools libisoburn squashfs-tools \
                git curl rclone wget base-devel jq zip unzip fakeroot binutils openssl aws-cli \
                pacman-contrib shadow go rust cargo; then
              exit 0
            fi
            find "$cachedir" -maxdepth 1 -name '*.part' -delete
            if (( attempt < 3 )); then
              echo "Build dependency download failed (attempt $attempt/3); retrying in $((attempt * 30)) s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Build dependency download failed after 3 attempts; the failing package is in pacman's output above"
          exit 1

      - name: Build local feral-player bundle
        if: ${{ needs.determine-local-player.outputs.enabled == 'true' }}
        working-directory: feral-player
        env:
          NEXT_PUBLIC_ENVIRONMENT: ${{ inputs.environment }}
          NEXT_PUBLIC_PUB_DOC_URL: ${{ vars.PUB_DOC_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_PLAYER }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NEXT_PUBLIC_PUB_DOC_URL}" ]; then
            echo "::error::Missing required environment variable: NEXT_PUBLIC_PUB_DOC_URL"
            exit 1
          fi

          npm ci
          NEXT_PUBLIC_DISABLE_VERSION_CHECK=true npm run build

      - uses: actions/download-artifact@v4
        if: needs.determine-local-player.outputs.native == 'true'
        with:
          name: ff-player-native-linux-x86_64
          repository: ${{ needs.native.outputs.repository }}
          run-id: ${{ needs.native.outputs.run }}
          github-token: ${{ github.token }}
          path: native-artifact
      - name: Build local FFOS packages (no R2 upload)
        env:
          PKG_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          COMPONENTS=(
            feral-controld
            feral-sys-monitord
            feral-watchdog
          )

          useradd -m builder || true
          mkdir -p /build/local-repo/x86_64

          for COMP in "${COMPONENTS[@]}"; do
            WORKDIR="$GITHUB_WORKSPACE/ffos-user/components/$COMP"
            TARBALL="${COMP}_${PKG_VERSION}.tar.gz"

            cd "$WORKDIR"
            rm -f ./*.pkg.tar.zst ./*.pkg.tar.zst.sig "$TARBALL" PKGBUILD

            tar czf "/tmp/${TARBALL}" --exclude="${TARBALL}" .
            mv "/tmp/${TARBALL}" .

            if [ -f "Cargo.toml" ]; then
              BINARY_NAME=$(grep -m 1 '^[[:space:]]*name[[:space:]]*=' Cargo.toml | cut -d '"' -f 2 || true)
              if [ -z "$BINARY_NAME" ]; then
                BINARY_NAME="$COMP"
              fi
              cat <<EOF > PKGBUILD
          # Maintainer: GitHub Actions
          pkgname=${COMP}
          pkgver=${PKG_VERSION}
          pkgrel=1
          pkgdesc="Feral File component package"
          arch=('x86_64' 'aarch64')
          url="https://github.com/${{ github.repository }}"
          license=('MIT')
          depends=()
          makedepends=('rust' 'cargo')
          options=(!strip)
          source=("${TARBALL}")
          sha256sums=('SKIP')

          build() {
            cd "\$srcdir"
            cargo build --profile=release
          }

          package() {
            install -Dm755 "\$srcdir/target/release/${BINARY_NAME}" "\$pkgdir/usr/bin/${COMP}"
          }
          EOF
            else
              # feral-file#3551: the capability marker the device's package rail and
              # OTA guard require before installing feral-controld where controller
              # state exists. Only a checkout that carries the protocol earns it; the
              # version input is operator-typed and proves nothing.
              # LOCKSTEP: ffos-user pins components/feral-controld/control/ with a
              # test; renaming it must change this check in the same release.
              # feral-file#3551: a controld that dials the device-ID relay (relaywire/)
              # without the control authority (control/) accepts plaintext commands from
              # anyone who knows the device ID. Refuse to build it.
              # LOCKSTEP: ffos-user keeps relaywire/ and control/ under feral-controld.
              if [ "$COMP" = "feral-controld" ] && [ -d "$WORKDIR/relaywire" ] && [ ! -d "$WORKDIR/control" ]; then
                echo "::error::feral-controld has relaywire/ but no control/: refusing to build an unauthenticated v2 relay client (feral-file#3551)"
                exit 1
              fi
              CONTROL_PROVIDES=""
              if [ "$COMP" = "feral-controld" ] && [ -d "$WORKDIR/control" ]; then
                CONTROL_PROVIDES="provides=('feral-controld-control-v1')"
              fi
              cat <<EOF > PKGBUILD
          # Maintainer: GitHub Actions
          pkgname=${COMP}
          pkgver=${PKG_VERSION}
          pkgrel=1
          pkgdesc="Feral File component package"
          arch=('x86_64' 'aarch64')
          url="https://github.com/${{ github.repository }}"
          license=('MIT')
          depends=()
          makedepends=('go')
          ${CONTROL_PROVIDES}
          options=(!strip)
          source=("${TARBALL}")
          sha256sums=('SKIP')

          build() {
            cd "\$srcdir"
            go build -v -o "${COMP}"
          }

          package() {
            install -Dm755 "\$srcdir/${COMP}" "\$pkgdir/usr/bin/${COMP}"
          }
          EOF
            fi

            chown -R builder:builder "$WORKDIR"
            su builder -c "cd \"$WORKDIR\" && makepkg -f --skipinteg"
            cp ./*.pkg.tar.zst /build/local-repo/x86_64/
          done

          if [ "${{ needs.determine-local-player.outputs.enabled }}" = "true" ]; then
            PLAYER_PKG_DIR=/tmp/feral-player-pkg
            PLAYER_TARBALL="feral-player_${PKG_VERSION}.tar.gz"
            PLAYER_OUT="$GITHUB_WORKSPACE/feral-player/out"

            rm -rf "$PLAYER_PKG_DIR"
            mkdir -p "$PLAYER_PKG_DIR"
            tar czf "$PLAYER_PKG_DIR/$PLAYER_TARBALL" -C "$PLAYER_OUT" .

            cd "$PLAYER_PKG_DIR"
            cat <<EOF > PKGBUILD
          # Maintainer: GitHub Actions
          pkgname=feral-player
          pkgver=${PKG_VERSION}
          pkgrel=1
          pkgdesc="FF Player Static Web Application"
          arch=('x86_64' 'aarch64')
          url="https://github.com/feral-file/ff-player"
          license=('MIT')
          depends=()
          options=(!strip)
          source=("${PLAYER_TARBALL}")
          sha256sums=('SKIP')

          package() {
            install -dm755 "\$pkgdir/opt/feral/feral-player"
            cp -r "\$srcdir"/. "\$pkgdir/opt/feral/feral-player/"
          }
          EOF

            chown -R builder:builder "$PLAYER_PKG_DIR"
            su builder -c "cd \"$PLAYER_PKG_DIR\" && makepkg -f --skipinteg"
            cp ./*.pkg.tar.zst /build/local-repo/x86_64/
          fi

          if [ "${{ needs.determine-local-player.outputs.native }}" = true ]; then
            cd "$GITHUB_WORKSPACE"
            python packages/ff-player-native/prepare.py --artifact native-artifact/ff-player-cef-linux.tar.gz \
              --sha256 "$(cut -d' ' -f1 native-artifact/SHA256SUMS)" --version "${{ needs.native.outputs.version }}" \
              --epoch "${{ needs.native.outputs.epoch }}" --output /tmp/native-package
            chown -R builder:builder /tmp/native-package
            su builder -c 'cd /tmp/native-package && makepkg -df'
            cp /tmp/native-package/*.pkg.tar.zst /build/local-repo/x86_64/
          fi
          cd /build/local-repo/x86_64
          repo-add feralfile-local.db.tar.gz ./*.pkg.tar.zst

      # Same reuse rule as build-pkgbuild.yaml: identical package inputs and
      # snapshot mean an identical module, so skip the ~8 min rebuild.
      - name: Restore previously built kernel-module package
        id: module-cache
        uses: actions/cache@v4
        with:
          path: packages/amdgpu-vcn-h264-cap/*.pkg.tar.zst
          key: pkgbuild-amdgpu-vcn-h264-cap-${{ inputs.pacman_snapshot || github.event.inputs.pacman_snapshot }}-${{ hashFiles('packages/amdgpu-vcn-h264-cap/*') }}

      - name: Build local kernel-module package (no R2 upload)
        run: |
          set -euo pipefail
          # Same PKGBUILD the R2 rail builds via build-pkgbuild.yaml; here it
          # joins the local repo so tag builds carry the amdgpu cap too.
          PKGDIR="$GITHUB_WORKSPACE/packages/amdgpu-vcn-h264-cap"
          useradd -m builder || true
          chown -R builder:builder "$PKGDIR"
          SRCINFO="$(su builder -c "cd \"$PKGDIR\" && makepkg --printsrcinfo")"
          mapfile -t MAKEDEPENDS < <(printf '%s\n' "$SRCINFO" | awk -F' = ' '/^\tmakedepends = /{print $2}')
          mapfile -t DEPENDS < <(printf '%s\n' "$SRCINFO" | awk -F' = ' '/^\tdepends = /{print $2}')
          (( ${#MAKEDEPENDS[@]} )) || { echo "::error::no makedepends parsed from .SRCINFO"; exit 1; }
          (( ${#DEPENDS[@]} )) || { echo "::error::no depends parsed from .SRCINFO"; exit 1; }
          # Same guard as build-pkgbuild.yaml: a kernel pin the snapshot cannot
          # satisfy must fail here with the reason, not later inside makepkg or
          # mkarchiso with a generic message.
          for dep in "${DEPENDS[@]}"; do
            name="${dep%%[<>=]*}"; want="${dep#"$name"}"
            have="$(pacman -Si "$name" | awk -F': *' '/^Version/{print $2; exit}')"
            if [[ "$want" == =* && "$have" != "${want#=}" ]]; then
              echo "::error::packages/amdgpu-vcn-h264-cap pins $dep but the pacman snapshot ships $name $have. Re-base the package (see its README) or pin the matching snapshot."
              exit 1
            fi
          done
          if [ "${{ steps.module-cache.outputs.cache-hit }}" = "true" ]; then
            echo "reusing kernel-module package built earlier for identical inputs (cache hit)"
          else
            # Inline retry (archive stalls); no scripts/ here, see "Install build dependencies".
            cachedir="$(pacman-conf CacheDir | head -n1)"
            for attempt in 1 2 3; do
              if pacman -S --noconfirm --needed base-devel "${MAKEDEPENDS[@]}"; then
                break
              fi
              if (( attempt == 3 )); then
                echo "::error::makedepends download failed after 3 attempts; the failing package is in pacman's output above"
                exit 1
              fi
              find "$cachedir" -maxdepth 1 -name '*.part' -delete
              echo "makedepends download failed (attempt $attempt/3); retrying in $((attempt * 30)) s"
              sleep $((attempt * 30))
            done
            su builder -c "cd \"$PKGDIR\" && makepkg -f -d --noconfirm"
          fi
          ls -la "$PKGDIR"/amdgpu-vcn-h264-cap-*.pkg.tar.zst
          cp "$PKGDIR"/amdgpu-vcn-h264-cap-*.pkg.tar.zst /build/local-repo/x86_64/
          # The extracted kernel tree plus unstripped objects is several GB;
          # this job goes on to build a squashfs and an ISO on the same disk.
          rm -rf "$PKGDIR/src" "$PKGDIR/pkg"
          cd /build/local-repo/x86_64
          repo-add feralfile-local.db.tar.gz ./amdgpu-vcn-h264-cap-*.pkg.tar.zst

      - name: Apply version-specific patches
        run: |
          if [ "${{ inputs.pacman_snapshot || github.event.inputs.pacman_snapshot }}" = "2025/05/31" ]; then
            echo "Applying patches for 2025/05/31 snapshot..."
            sed -i "s/bootmodes=('uefi.systemd-boot')/bootmodes=('uefi-x64.systemd-boot.esp' 'uefi-x64.systemd-boot.eltorito')/" archiso-ff1/profiledef.sh
            sed -i 's/wlroots0.18/wlroots/' archiso-ff1/packages.x86_64
          fi

      - name: Copy archiso profile and setup home directories
        run: |
          mkdir -p /build
          cp -r archiso-ff1 /build/

          mkdir -p /build/archiso-ff1/airootfs/home
          cp -r ffos-user/users/feralfile /build/archiso-ff1/airootfs/home/

          mkdir -p /build/archiso-ff1/pacman.d
          cp /etc/pacman.d/mirrorlist.device /build/archiso-ff1/pacman.d/mirrorlist

          # The image ships the device mirrorlist: no cache token, no CI-only
          # umea fallback (see setup-pacman).
          mkdir -p /build/archiso-ff1/airootfs/etc/pacman.d
          cp /etc/pacman.d/mirrorlist.device /build/archiso-ff1/airootfs/etc/pacman.d/mirrorlist
          cp /build/archiso-ff1/airootfs/etc/pacman.d/feralfile-pkg-pubkey.asc /etc/pacman.d/feralfile-pkg-pubkey.asc

          pacman-key --add /etc/pacman.d/feralfile-pkg-pubkey.asc
          pacman-key --lsign-key AA6B250F2938F3CB

      - name: Update start-kiosk.sh
        if: ${{ inputs.dev_iso }}
        run: |
          sed -i 's/--kiosk//' /build/archiso-ff1/airootfs/home/feralfile/scripts/start-kiosk.sh

      - name: Add development tools to packages list
        if: ${{ inputs.dev_iso }}
        run: |
          cat >> /build/archiso-ff1/packages.x86_64 << EOF

          # Development tools
          go
          rust
          base-devel
          EOF
          sed -i 's/#NoConfirm/NoConfirm/' /etc/pacman.conf 2>/dev/null || echo "NoConfirm" >> /etc/pacman.conf

      - name: Setup source directory and copy components
        if: ${{ inputs.dev_iso }}
        run: |
          mkdir -p /build/archiso-ff1/airootfs/home/feralfile/src
          echo "Branch: ${{ github.ref_name }}" > /build/archiso-ff1/airootfs/home/feralfile/src/repo-info.txt
          echo "Version: ${{ inputs.version }}" >> /build/archiso-ff1/airootfs/home/feralfile/src/repo-info.txt
          echo "Build Date: $(date)" >> /build/archiso-ff1/airootfs/home/feralfile/src/repo-info.txt
          cp -r ffos-user/components /build/archiso-ff1/airootfs/home/feralfile/src/

      - name: Inject pacman.conf for build and runtime
        env:
          NATIVE_PROFILE: ${{ needs.determine-local-player.outputs.native }}
        run: |
          set -e

          ENVIRONMENT="${{ inputs.environment }}"

          if [ "$ENVIRONMENT" = "Production" ]; then
            DOMAIN="ffos.feralfile.com"
          else
            DOMAIN="ffosdev.feralfile.com"
          fi

          # Save the archiso profile's original pacman.conf before modifying
          cp /build/archiso-ff1/pacman.conf /build/archiso-ff1/pacman.conf.orig

          # Build-time pacman config:
          # Only the local repo with freshly built packages from selected tags.
          # The remote [feralfile] repo is NOT included here because the R2 path
          # may not exist for the branch/tag being built. All feralfile component
          # packages are built locally, so the remote repo is not needed at build time.
          cat >> /build/archiso-ff1/pacman.conf << EOF
          [feralfile-local]
          SigLevel = Required DatabaseOptional TrustedOnly
          Server = file:///build/local-repo/\$arch
          EOF

          # Historical tags retain the package rail compatible with their kiosk.
          case "$NATIVE_PROFILE" in
            true) package_path=native/os ;;
            false) package_path=os ;;
            *) exit 1 ;;
          esac

          # Runtime pacman config inside ISO should point to remote R2 repo only,
          # so systems can update to latest packages from that channel.
          # Use archiso profile's original pacman.conf as base (not the container's /etc/pacman.conf)
          cp /build/archiso-ff1/pacman.conf.orig /build/archiso-ff1/airootfs/etc/pacman.conf
          cat >> /build/archiso-ff1/airootfs/etc/pacman.conf << EOF
          [feralfile]
          SigLevel = Required DatabaseOptional TrustedOnly
          Server = https://${DOMAIN}/archlinux/${{ github.ref_name }}/${package_path}/\$arch
          EOF

      - name: Copy UI files
        run: |
          # launcher-ui is retired: the kiosk now serves ff-player (feral-player
          # package) at http://127.0.0.1:8080/, so /opt/feral/ui/launcher is no
          # longer provisioned into the image.
          if [ "${{ needs.determine-local-player.outputs.native }}" != true ]; then
            mkdir -p /build/archiso-ff1/airootfs/opt/feral/ui/player
            cp -r ffos-user/components/player-wrapper-ui/* /build/archiso-ff1/airootfs/opt/feral/ui/player/
          fi
          mkdir -p /build/archiso-ff1/airootfs/home/feralfile/.logs

      - name: Add Configs and Services
        env:
          FERAL_CONTROLD_CONFIG_JSON: ${{ secrets.FERAL_CONTROLD_CONFIG_JSON }}
          FERAL_FF1_CONFIG_JSON: ${{ secrets.FERAL_FF1_CONFIG_JSON }}
          FERAL_SYS_MONITORD_CONFIG_JSON: ${{ secrets.FERAL_SYS_MONITORD_CONFIG_JSON }}
          FERAL_WATCHDOG_CONFIG_JSON: ${{ secrets.FERAL_WATCHDOG_CONFIG_JSON }}
          BUILD_BRANCH: ${{ github.ref_name }}
          BUILD_VERSION: ${{ inputs.version }}
          LOG_STREAM_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          mkdir -p /build/archiso-ff1/airootfs/home/feralfile/.config

          write_json() {
            local target="$1"
            local content="$2"
            local filter="${3:-.}"
            local mode="${4:-755}"
            local name
            name="$(basename "$target")"

            if [ -z "$content" ]; then
              echo "::error::Missing ${name} JSON secret"
              exit 1
            fi

            printf '%s' "$content" \
              | jq --arg branch "$BUILD_BRANCH" --arg version "$BUILD_VERSION" \
                  --arg log_stream_environment "$LOG_STREAM_ENVIRONMENT" "$filter" \
              > "$target"
            chmod "$mode" "$target"
          }

          # Overlay per-build values (branch/version) that change every build and
          # therefore cannot be baked into the environment-scoped JSON secrets.
          # offlineCache mirrors offlinecache/bootstrap.go defaults with ONE
          # deliberate exception: maxDiskBytes. The code default is 10 GiB
          # (DefaultMaxDiskBytes); the image ships 80 GB in DECIMAL units (10^9),
          # not GiB. The unit break from the code's binary convention is the
          # point: this budget is surfaced to users by ff-app, whose
          # Ff1StorageUsage.formatBytes divides by 10^9 and labels the result
          # "GB" — so a binary 80 GiB would render as "85.9 GB" on the device
          # storage screen. Do not "tidy" this into a round binary number, and
          # do not drop it back to the code default: either silently changes
          # what a fielded device reports to its owner.
          #
          # Why 80 and not more, on an FF1's 127.5 GB disk: this value is the
          # ONLY guard between the cache and the OS. offlinecache never calls
          # statfs — reclaimDiskForCapture's maxDiskBytes/8 floor (10 GB here)
          # reserves headroom INSIDE the budget, not on the disk.
          # feral-recovery-update.sh checks no free space before downloading, and
          # feral-system-update.sh's precheck (ffos#124) only refuses an update
          # that will not fit. An over-large budget therefore does not merely
          # stop the cache growing; it makes the OTA refuse to run (or die on
          # ENOSPC) and strands the device on its old version, losing remote
          # fixability. That precheck budgets @ota_new from the same 3.4 GB
          # figure below; keep the two in step.
          # The 47.5 GB left over covers the worst case with ~19 GB spare:
          # OS + user state 4.7, Chromium's uncapped disk cache ~3,
          # @factory_reset once diverged 3.4, a resident @recovery_candidate
          # 3.4, the OTA transient (1.06 ISO + 3.4 @ota_new + 0.1 staging) 4.6,
          # log growth 1, btrfs metadata/global reserve 2, and a 5% btrfs
          # free-space floor 6.4 — about 28.5 GB total.
          # captureWindowMs omitted/0 uses 20s.
          #
          # signatureVerification is the fleet kill switch for DP-1 playlist
          # signature verification (ffos-user#307; controld's
          # config.SignatureVerificationConfig). An absent section already
          # means ON, so pinning {disabled: false} changes no behavior; it is
          # written here, like offlineCache, so the switch lives in a reviewed
          # diff on the build branch rather than in the environment secret
          # (which this overlay overrides), and so the next operator finds it.
          # Flip it to true only on evidence of a systematic false "invalid"
          # across the fleet (a verifier/canonicalization divergence between
          # the device and the signer). With it on, controld computes no
          # verdict, omits every signatureStatus field, refuses
          # setSignatureVerificationMode, and drops signatureVerificationMode
          # from device_status so ff-app hides the setting. The owner's chosen
          # mode (silent/notify/strict, default notify) is NOT config: controld
          # persists it at /home/feralfile/.state/signature-verification.json,
          # which feral-system-update.sh's rsync exclusion of
          # /home/feralfile/.state carries across OTA (see
          # docs/SNAPSHOT_SYSTEM_V2_FLOW.md).
          #
          # mediaHealth (ffos-user#392, docs/media-health.md there) is the
          # device-side media observation store and its probes. Pinned here
          # for the same reason as signatureVerification: the switches live
          # in a reviewed diff on the build branch and the next operator
          # finds them. disabled=true is the L0 kill switch (casts forwarded
          # unprobed, no hints, no per-item status); L0 is ON. l1.enabled
          # turns on the nightly render probe (ffos-user#443): it renders
          # untrusted pages in the offline cache's headless Chromium while
          # the panel sleeps, so it needs offlineCache.enabled above; ON.
          # wallCapture.enabled turns on the wall frame (ffos-user#450): a
          # screenshot of the artwork on the kiosk 15 s after it is on
          # screen, judged with the same classifier; ON. Both are ADVISORY
          # while renderConclusive is false, which is pinned here: a frame
          # that rendered is play evidence, but a blank or error-page frame
          # only marks the work `suspect` for the app — never a skip, never
          # a rejection. renderConclusive=true lets a corroborated render
          # negative conclude broken (and skip); it stays OFF until the
          # fixture works are judged against the device's own frames, since
          # a false blank hides real art. Other mediaHealth / l1 /
          # wallCapture keys from the environment secret (knownBadPageMarkers,
          # knownBad fingerprints, minAsleepSeconds, maxPerNight, settle
          # windows, blankVarianceThreshold, maxEdge) are kept. Safe on every
          # controld: a build without the feature ignores the key, and one
          # with it decodes the block permissively (a bad value reads as its
          # default, never a crash loop). ipfsGateways / arweaveGateways
          # are the ordered fallback gateways the media-health probe tries
          # when a content-addressed source's own gateway answers 404, and
          # the kiosk then loads the work through (ffos-user#392 gateway
          # fallback); pinned to the measured defaults unless the
          # environment secret sets its own list.
          #
          # raster is dropped: controld once read a device Raster read key
          # from raster.apiKey (ffos-user wallet walks, feral-file#3576), but
          # Raster's read API needs no key and controld no longer reads the
          # block (ffos-user#457). Deleting it here keeps a key still sitting
          # in an environment secret off the image, the same way .sentry is.
          write_json "/build/archiso-ff1/airootfs/home/feralfile/.config/controld.json" "$FERAL_CONTROLD_CONFIG_JSON" '
            del(.sentry)
            | del(.raster)
            | .logStreaming = ((.logStreaming // {}) + {
                endpoint: "https://677c668ad85c407fb1f0b68f63f41f21.ingest.cloudflare.com",
                environment: ($log_stream_environment | ascii_downcase)
              })
            | .logStreaming.sampleRate //= 1
            | .logStreaming.playerSampleRate //= 1
            | .signatureVerification = { disabled: false }
            | .mediaHealth = ((.mediaHealth // {}) + { disabled: false, renderConclusive: false })
            | .mediaHealth.l1 = ((.mediaHealth.l1 // {}) + { enabled: true })
            | .mediaHealth.wallCapture = ((.mediaHealth.wallCapture // {}) + { enabled: true })
            | .mediaHealth.ipfsGateways //= ["https://ipfs.filebase.io", "https://gateway.pinata.cloud"]
            | .mediaHealth.arweaveGateways //= ["https://arweave.net"]
            | .offlineCache = {
                enabled: true,
                rootDir: "/home/feralfile/.cache/offline-artworks",
                maxDiskBytes: 80000000000,
                headlessBinaryPath: "/usr/bin/chromium",
                headlessUserDataDir: "/home/feralfile/.cache/offline-artworks-headless-profile",
                headlessDebugPort: 9223,
                headlessIdleTeardownSeconds: 30,
                staticServerAddr: "127.0.0.1:8082",
                missPolicy: "fail_closed"
              }' 600
          # feral-file#3551 release ordering: an image may enable secure control
          # only if its ffos ref carries controller state across a full-image
          # OTA (ota-control-state.sh, called by feral-system-update.sh).
          # Without it the image's own updater would drop or resurrect grants
          # on its next OTA, so strip .control from the overlay result. This
          # matters most for build-image-from-tags.yml, whose ffos_ref can be
          # an older tag. The ffos-user ref must also carry the protocol
          # (components/feral-controld/control/): a pre-protocol controld
          # ignores .control. That check is exact where controld is built from
          # this checkout (build-image-to-cf.yml, build-image-from-tags.yml);
          # pure-build-image-to-cf.yml installs controld from the branch's
          # package repository, so there it only reflects the ref. On every
          # path the device itself refuses an image or package whose
          # feral-controld lacks the feral-controld-control-v1 marker while it
          # holds control state (ota-control-state.sh). A missing checkout
          # fails the build rather than silently shipping control off. Keep
          # the three image workflows identical (scripts/verify.sh pins it).
          controld_json=/build/archiso-ff1/airootfs/home/feralfile/.config/controld.json
          if [ ! -d "$GITHUB_WORKSPACE/ffos-user/components" ]; then
            echo "::error::controld.json: ffos-user checkout missing at $GITHUB_WORKSPACE/ffos-user; cannot judge the control gate"
            exit 1
          elif [ ! -f /build/archiso-ff1/airootfs/root/scripts/ota-control-state.sh ]; then
            echo "::warning::controld.json: ffos ref lacks ota-control-state.sh; forcing del(.control) (secure control stays off)"
            stripped="$(jq 'del(.control)' "$controld_json")"
            printf '%s\n' "$stripped" > "$controld_json"
          elif [ ! -d "$GITHUB_WORKSPACE/ffos-user/components/feral-controld/control" ]; then
            echo "::warning::controld.json: ffos-user ref lacks components/feral-controld/control; forcing del(.control) (secure control stays off)"
            stripped="$(jq 'del(.control)' "$controld_json")"
            printf '%s\n' "$stripped" > "$controld_json"
          else
            echo "controld.json: ffos ref has ota-control-state.sh and ffos-user ref has the control protocol; keeping .control as configured"
          fi
          # A ref whose feral-controld carries the v2 relay client (relaywire/)
          # must ship a v2 endpoint: v2 eligibility follows control state on
          # disk, not control.enabled, and a G3 image without relayV2 would
          # leave its devices with no route once the legacy relayer retires
          # (docs/SNAPSHOT_SYSTEM_V2_FLOW.md; ffos-user docs/ff1-control-v1.md §15.3).
          if [ -d "$GITHUB_WORKSPACE/ffos-user/components/feral-controld/relaywire" ] \
            && [ -z "$(jq -r '.relayV2.endpoint // ""' "$controld_json")" ]; then
            echo "::error::controld.json: the ffos-user ref carries the v2 relay client but .relayV2.endpoint is empty; set it in FERAL_CONTROLD_CONFIG_JSON"
            exit 1
          fi
          # end feral-file#3551 control gate
          write_json "/build/archiso-ff1/airootfs/home/feralfile/.config/sys-monitord.json" "$FERAL_SYS_MONITORD_CONFIG_JSON" '.sentry.release = $version'
          watchdog_filter='.sentry.release = $version'
          if grep -qx ff-player-native /build/archiso-ff1/packages.x86_64; then
            watchdog_filter+=' | del(.cdp)'
          fi
          write_json "/build/archiso-ff1/airootfs/home/feralfile/.config/watchdog.json" "$FERAL_WATCHDOG_CONFIG_JSON" "$watchdog_filter"
          write_json "/build/archiso-ff1/airootfs/home/feralfile/ff1-config.json" "$FERAL_FF1_CONFIG_JSON" '.branch = $branch | .version = $version'

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF

      - name: Configure AWS credentials (OIDC for KMS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_KMS_FF1_RELEASE_SIGNER_ROLE_ARN }}
          aws-region: "ap-northeast-1"

      - name: Install kmspgp
        run: |
          # -f: a GitHub release 504 must fail here, not be saved as the
          # "binary" (it was, and the sign step then died running HTML as a
          # shell script). --retry rides out those transient 5xx. The pinned
          # digest proves the file is the v1.1.0 ELF before it runs with the
          # KMS signing credentials; bump it together with the URL.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o /usr/local/bin/kmspgp \
            https://github.com/hf/kmspgp/releases/download/v1.1.0/kmspgp-v1.1.0-linux-amd64
          echo "a9e1f438aac06657aa726b65031079f5e27b1d1e41dd1ffa7bf55326a8ca2547  /usr/local/bin/kmspgp" \
            | sha256sum -c -
          chmod +x /usr/local/bin/kmspgp

      - name: Sign packages with AWS KMS (OpenPGP)
        working-directory: /build/local-repo/x86_64
        env:
          KMS_KEY_ID: ${{ secrets.AWS_KMS_FF1_RELEASE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          for p in *.pkg.tar.zst; do
            kmspgp sign "$KMS_KEY_ID" < "$p" | gpg --dearmor > "$p.sig"
            pacman-key --verify "$p.sig" "$p"
          done
          repo-add feralfile-local.db.tar.gz ./*.pkg.tar.zst

      # ffos#163: pacman gives up on a package after 10 s at under 1 B/s, the
      # [feralfile] repo has a single Server, and pacman itself never retries,
      # so one transient stall used to abort mkarchiso after every component
      # had already built. Download the whole package set here with a bounded
      # retry instead; mkarchiso's pacstrap runs with -c (the host's
      # /var/cache/pacman/pkg) and installs from this cache.
      #
      # Trust is unchanged: -w only downloads. pacstrap still verifies every
      # package against SigLevel when it installs, so a corrupt or wrongly
      # signed file in the cache fails the build exactly as before.
      #
      # The empty --dbpath makes pacman resolve the full dependency closure the
      # way pacstrap does for an empty root; against the container's own
      # database it would skip anything the build container already has
      # installed. Partial *.part files are dropped between attempts so a retry
      # never depends on the server honoring Range.
      #
      # Keep this step byte-identical in build-image-to-cf.yml,
      # pure-build-image-to-cf.yml and build-image-from-tags.yml; scripts/verify.sh
      # pins that. It is inline rather than a script because
      # build-image-from-tags.yml checks ffos out at an older tag, where a new
      # script file would not exist.
      - name: Prefetch image packages
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(sed -e 's/#.*//' -e 's/[[:space:]]//g' /build/archiso-ff1/packages.x86_64 | grep -v '^$')
          dbpath="$(mktemp -d)"
          cachedir="$(pacman-conf CacheDir | head -n1)"
          config=/build/archiso-ff1/pacman.conf
          for attempt in 1 2 3; do
            if (( attempt == 2 )); then
              # A mirror can have the snapshot database but lack its package
              # links. Use the exact archive filename pacman resolved, including
              # for detached signatures. Restart each transfer without Range.
              cat > "$dbpath/fetch" <<'FETCH'
          #!/bin/bash
          set -eu
          url=$1
          output=$2
          fetch=(curl --fail --silent --show-error --location --connect-timeout 15
                 --speed-limit 1 --speed-time 60 --max-time 600 --output "$output")
          case "$url" in
            https://archive.archlinux.org/repos/*/*.pkg.tar.*|https://umea.archive.pkgbuild.com/repos/*/*.pkg.tar.*)
              file=${url##*/}
              stem=${file%.pkg.tar.*}
              name=${stem%-*-*-*} # strip pkgver-pkgrel-arch
              for host in umea.archive.pkgbuild.com archive.archlinux.org; do
                if "${fetch[@]}" "https://$host/packages/${name:0:1}/$name/$file"; then
                  exit 0
                fi
              done
              ;;
          esac
          exec "${fetch[@]}" "$url"
          FETCH
              chmod 755 "$dbpath/fetch"
              sed "/^\[options\]$/a XferCommand = $dbpath/fetch %u %o" "$config" > "$dbpath/retry.conf"
              config="$dbpath/retry.conf"
            fi
            if pacman --config "$config" --dbpath "$dbpath" \
                --cachedir "$cachedir" -Syw --noconfirm "${pkgs[@]}"; then
              exit 0
            fi
            find "$cachedir" -maxdepth 1 -name '*.part' -delete
            if (( attempt < 3 )); then
              echo "Package download failed (attempt $attempt/3); retrying in $((attempt * 15)) s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Package download failed after 3 attempts; the failing package is in pacman's output above"
          exit 1

      - name: Build, sign and upload ISO image
        run: |
          cd /build
          mkarchiso -v -w /build/work -o /build/out /build/archiso-ff1
          # The build container's mirrorlist carries the ff-arch-cache token
          # (see .github/actions/setup-pacman); an image must ship
          # mirrorlist.device instead. Checked on the root mkarchiso actually
          # built, before anything is signed or uploaded, and failing when
          # that root cannot be found: a leak would publish the token in every
          # ISO, with no other symptom.
          image_etc=/build/work/x86_64/airootfs/etc
          if [ ! -d "$image_etc" ]; then
            echo "::error::$image_etc is missing; cannot check the image for the arch-cache token"
            exit 1
          fi
          # Only grep's "no match" status (1) passes. 0 is a match, and
          # anything else means grep could not read part of the tree, which
          # must not be taken for a clean image.
          found=0
          grep -rIlF 'arch-cache.feralfile.io' "$image_etc" || found=$?
          if [ "$found" -ne 1 ]; then
            echo "::error::the image would ship the ff-arch-cache mirror (files listed above), or its /etc could not be searched (grep status $found); images must carry /etc/pacman.d/mirrorlist.device"
            exit 1
          fi
          ISO_FILE=$(ls /build/out/*.iso | head -n 1)
          if [ -f "$ISO_FILE" ]; then
            IMAGE_TYPE="${{ inputs.dev_iso && 'dev-' || '' }}"
            if [ "${{ github.ref_name }}" = "release" ]; then
              IMAGE_TAG="-release"
            elif [ "${{ github.ref_name }}" = "demo" ]; then
              IMAGE_TAG="-demo"
            elif [ "${{ github.ref_name }}" = "develop" ]; then
              IMAGE_TAG="-develop"
            elif [ "${{ github.ref_name }}" = "staging" ]; then
              IMAGE_TAG="-staging"
            else
              IMAGE_TAG=""
            fi
            NEW_NAME="FF1${IMAGE_TAG}-${IMAGE_TYPE}${{ inputs.version }}.iso"
            mv "$ISO_FILE" "/build/out/$NEW_NAME"
            echo "ISO created: /build/out/$NEW_NAME"
            if [ "${{ needs.determine-local-player.outputs.native }}" = true ]; then
              bash "$GITHUB_WORKSPACE/workflow-verifier/scripts/verify-native-iso.sh" "/build/out/$NEW_NAME" "${{ needs.native.outputs.version }}" "${{ inputs.version }}" feral-controld feral-watchdog feral-sys-monitord
            fi

            cd /build/out
            openssl dgst -sha256 -binary "$NEW_NAME" > iso.sha256

            SIGNATURE_B64=$(aws kms sign \
              --key-id "${{ secrets.AWS_KMS_FF1_RELEASE_SIGNING_KEY_ID }}" \
              --message fileb://iso.sha256 \
              --message-type DIGEST \
              --signing-algorithm RSASSA_PKCS1_V1_5_SHA_256 \
              --output text \
              --query Signature) || {
                echo "Error: AWS KMS signing failed"
                exit 1
              }
            if [ -z "$SIGNATURE_B64" ]; then
              echo "Error: Empty signature output from AWS KMS"
              exit 1
            fi
            echo "$SIGNATURE_B64" | base64 --decode > "$NEW_NAME.sig"
            echo "Signature written to $NEW_NAME.sig"

            rclone copyto "$NEW_NAME" \
              "r2:${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}/${{ github.ref_name }}/$NEW_NAME" \
              --s3-upload-cutoff=100M \
              --s3-chunk-size=100M \
              --transfers=7 \
              --verbose \
              --stats=1s
            echo "Image successfully uploaded to R2: ${NEW_NAME}"

            rclone copyto "$NEW_NAME.sig" \
              "r2:${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}/${{ github.ref_name }}/$NEW_NAME.sig" \
              --verbose
            echo "Image signature successfully uploaded to R2: ${NEW_NAME}.sig"
          else
            echo "Error: ISO file not found"
            exit 1
          fi

      - name: Publish Development OTA metadata
        if: ${{ inputs.environment == 'Development' && needs.determine-local-player.outputs.native == 'true' }}
        env:
          BRANCH_ROOT: r2:${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}/${{ github.ref_name }}
          IMAGE_VERSION: ${{ inputs.version }}
          ENVIRONMENT: Development
          UPDATE_REQUIRED: 'false'
          UPDATE_RUNTIME: 'false'
          UPDATE_RECOVERY: 'false'
        run: bash workflow-verifier/scripts/publish-version-info.sh

      - name: Cleanup
        if: always()
        run: |
          rm -rf /build
