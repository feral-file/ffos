name: ▶️ Manual Build Native Player Package

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to build"
        required: true
        default: "Development"
        type: choice
        options:
          - Development
          - Staging
          - Production
      ffos_user_ref:
        description: 'ffos-user revision containing the native player'
        required: true
        type: string
        default: 'develop'
      pacman_snapshot:
        description: "Pacman repository snapshot to use"
        required: false
        default: "2026/07/13"
        type: choice
        options:
          - "2026/07/13"
          - "2025/11/25"
          - "2025/05/31"
          - "latest"

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  permission-check:
    name: Permission Check
    uses: ./.github/workflows/permission-check.yaml

  resolve-container:
    needs: permission-check
    uses: ./.github/workflows/resolve-container.yaml
    with:
      pacman_snapshot: ${{ inputs.pacman_snapshot || github.event.inputs.pacman_snapshot }}

  build-native-player:
    needs: [permission-check, resolve-container]
    name: Package tested native player
    uses: ./.github/workflows/build-pkgbuild.yaml
    secrets:
      ARCH_CACHE_TOKEN: ${{ secrets.ARCH_CACHE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
      CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
      AWS_KMS_FF1_RELEASE_SIGNER_ROLE_ARN: ${{ secrets.AWS_KMS_FF1_RELEASE_SIGNER_ROLE_ARN }}
      AWS_KMS_FF1_RELEASE_SIGNING_KEY_ID: ${{ secrets.AWS_KMS_FF1_RELEASE_SIGNING_KEY_ID }}
    with:
      package: feral-display
      ffos_user_ref: ${{ inputs.ffos_user_ref }}
      environment: ${{ inputs.environment }}
      pacman_snapshot: ${{ inputs.pacman_snapshot }}
      container_image: ${{ needs.resolve-container.outputs.image }}
